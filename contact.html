<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contactez-nous | Airgon Group</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <meta name="description" content="Contactez Airgon Group pour vos projets de services techniques en Belgique et en France." />
  <link rel="canonical" href="https://www.airgon-group.com/contact.html" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f3f4f6;
      background: #0d0d0d;
      line-height: 1.6;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }
    img { display: block; width: 100%; object-fit: cover; }

    /* NAV */
    .contact-nav {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 40px;
    }
    .contact-nav .logo img {
      height: 32px;
      width: auto;
    }
    .contact-nav .back-link {
      font-size: 0.9rem;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      transition: color 0.3s;
    }
    .contact-nav .back-link:hover { color: #fff; }

    /* HERO */
    .contact-hero {
      position: relative;
      height: 50vh;
      min-height: 350px;
      display: flex;
      align-items: flex-end;
      padding: 60px 40px;
      overflow: hidden;
    }
    .contact-hero-bg {
      position: absolute;
      inset: 0;
    }
    .contact-hero-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .contact-hero-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(13,13,13,1));
    }
    .contact-hero h1 {
      position: relative;
      z-index: 1;
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.02em;
    }

    /* FORM SECTION */
    .contact-body {
      max-width: 900px;
      padding: 80px 40px 120px;
    }
    .contact-body h2 {
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 800;
      color: #a8b87c;
      margin-bottom: 16px;
    }
    .contact-body .intro {
      font-size: 1.05rem;
      color: rgba(255,255,255,0.65);
      margin-bottom: 48px;
      max-width: 700px;
      line-height: 1.7;
    }

    .contact-form { display: flex; flex-direction: column; gap: 24px; }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 18px 24px;
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 40px;
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }
    .contact-form input::placeholder,
    .contact-form textarea::placeholder {
      color: rgba(255,255,255,0.4);
    }
    .contact-form input:focus,
    .contact-form textarea:focus {
      border-color: rgba(255,255,255,0.6);
    }
    .contact-form textarea {
      border-radius: 20px;
      min-height: 200px;
      resize: vertical;
    }
    .contact-form button {
      align-self: flex-start;
      padding: 16px 48px;
      background: #a8b87c;
      color: #0d0d0d;
      border: none;
      border-radius: 40px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    .contact-form button:hover {
      background: #b8c88c;
      transform: translateY(-2px);
    }
    .form-success {
      display: none;
      color: #a8b87c;
      font-weight: 600;
      font-size: 1.05rem;
      margin-top: 8px;
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      .contact-hero { padding: 40px 24px; height: 40vh; }
      .contact-body { padding: 48px 24px 80px; }
      .form-row { grid-template-columns: 1fr; }
      .contact-nav { padding: 16px 24px; }
    }
  </style>
</head>
<body>

  <nav class="contact-nav">
    <a href="index.html" class="logo"><img src="logo-white.png" alt="Airgon Group" /></a>
    <a href="index.html" class="back-link">&larr; Retour au site</a>
  </nav>

  <section class="contact-hero">
    <div class="contact-hero-bg">
      <img src="https://images.pexels.com/photos/236698/pexels-photo-236698.jpeg?auto=compress&cs=tinysrgb&w=1920" alt="Site industriel" />
    </div>
    <h1>Contactez-nous</h1>
  </section>

  <section class="contact-body">
    <h2>Prenons contact</h2>
    <p class="intro">Que vous planifiez un projet, cherchiez un partenaire ou envisagiez une nouvelle étape pour votre entreprise.</p>

    <form class="contact-form" id="contact-form" onsubmit="handleContactSubmit(event)">
      <div class="form-row">
        <input type="text" name="name" placeholder="Nom" required />
        <input type="email" name="email" placeholder="Email" required />
      </div>
      <textarea name="message" placeholder="Message" required></textarea>
      <button type="submit">Envoyer</button>
      <div class="form-success" id="contact-success">Merci ! On revient vers vous bientôt.</div>
    </form>
  </section>

  <script>
    function handleContactSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);
      // Send via mailto fallback or integrate with your backend
      const subject = encodeURIComponent('Contact depuis airgon-group.com');
      const body = encodeURIComponent(
        'Nom: ' + data.get('name') + '\n' +
        'Email: ' + data.get('email') + '\n\n' +
        data.get('message')
      );
      window.location.href = 'mailto:giorgio@airgon-group.com?subject=' + subject + '&body=' + body;
      form.reset();
      document.getElementById('contact-success').style.display = 'block';
    }
  </script>

</body>
</html>
